<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080b16">
  <meta name="description" content="تسجيل الدخول إلى NOVA MARKET">

  <title>تسجيل الدخول | NOVA MARKET</title>

  <link
    rel="icon"
    type="image/png"
    href="https://i.postimg.cc/prbmgQVZ/Logo-N-futuriste-aux-teintes-neon.png"
  >

  <link
    rel="apple-touch-icon"
    href="https://i.postimg.cc/prbmgQVZ/Logo-N-futuriste-aux-teintes-neon.png"
  >

  <link rel="stylesheet" href="css/style.css">

  <!-- 1. مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. إعداد اتصال Supabase -->
  <script src="js/supabase-config.js"></script>
  <script src="js/role-redirect.js"></script>
  <!-- 3. الملفات العامة -->
  <script defer src="js/common.js"></script>

  <!-- 4. كود تسجيل الدخول -->
  <script defer src="js/auth.js"></script>
</head>

<body>

  <header class="topbar">
    <div class="container nav">

      <a class="brand nova-brand" href="index.html">
        <img
          src="https://i.postimg.cc/prbmgQVZ/Logo-N-futuriste-aux-teintes-neon.png"
          alt="NOVA MARKET"
          class="nova-logo"
        >

        <span class="nova-brand-text">
          <strong>NOVA</strong>
          <small>MARKET</small>
        </span>
      </a>

      <div class="nav-actions">
        <button
          class="button"
          type="button"
          data-theme-toggle
          aria-label="تغيير المظهر"
        >
          ◐
        </button>

        <a class="button" href="register.html">
          إنشاء حساب
        </a>
      </div>

    </div>
  </header>

  <main class="container">

    <section class="form-card">

      <span class="eyebrow">مرحبا بعودتك</span>

      <h1>دخول للحساب ديالك</h1>

      <p class="muted">
        دخل لحسابك باش تتواصل وتنشر إعلاناتك.
      </p>

      <!-- رسائل النجاح والخطأ -->
      <p
        id="auth-message"
        role="status"
        aria-live="polite"
        style="margin: 14px 0; overflow-wrap: anywhere;"
      ></p>

      <!-- تسجيل الدخول بالإيميل -->
      <form id="login-form">

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="name@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">كلمة السر</label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="دخل كلمة السر"
            required
          >
        </div>

        <button
          class="button button-primary"
          id="login-submit"
          type="submit"
          style="width: 100%;"
        >
          تسجيل الدخول
        </button>

      </form>

      <div style="text-align: center; margin: 18px 0;">
        <span class="muted">أو</span>
      </div>

      <!-- تسجيل الدخول باستخدام Google -->
      <button
        class="button"
        id="google-login"
        type="button"
        style="width: 100%;"
      >
        <strong>G</strong>
        المتابعة باستخدام Google
      </button>

      <p class="muted" style="text-align: center; margin-top: 24px;">
        ما عندكش حساب؟
        <a href="register.html" style="color: var(--secondary);">
          إنشاء حساب جديد
        </a>
      </p>

      <p style="text-align: center;">
        <a href="index.html" class="muted">
          ← الرجوع للسوق
        </a>
      </p>

    </section>

  </main>

  <footer class="footer">
    <div class="container">
      © NOVA MARKET
    </div>
  </footer>

  <!-- التحقق من اتصال Supabase -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const message = document.getElementById("auth-message");

      if (!window.supabase) {
        message.textContent =
          "مكتبة Supabase ما تحمّلاتش. تحقق من اتصال الإنترنت ومن تحميل المكتبة.";

        message.style.color = "#f87171";
        console.error("[NOVA] window.supabase غير موجود.");
        return;
      }

      if (!window.novaClient) {
        message.textContent =
          "اتصال Supabase ما تجهّزش. تحقق من js/supabase-config.js.";

        message.style.color = "#f87171";
        console.error("[NOVA] window.novaClient غير موجود.");
        return;
      }

      console.log("[NOVA] Supabase client موجود.");
    });
  </script>

</body>
</html>
